<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>calc-oracle</title>
<link rel="stylesheet" href="/style.css"/>
</head>
<body>
<header>
  <h1>calc-oracle</h1>
  <div class="counters" id="counters">loading…</div>
  <div class="actions">
    <button id="btn-runall">Run all</button>
    <button id="btn-regen">Regen matrix</button>
    <button id="btn-new">+ New</button>
  </div>
</header>
<main>
  <aside id="left">
    <div class="filter">
      <input type="search" id="f-text" placeholder="search…"/>
      <label>attacker <select id="f-attacker"><option value="">any</option></select></label>
      <label>item <select id="f-item"><option value="">any</option></select></label>
      <label>weather <select id="f-weather"><option value="">any</option></select></label>
      <label>terrain <select id="f-terrain"><option value="">any</option></select></label>
      <div class="radios">
        <label><input type="radio" name="status" value="all" checked/> all</label>
        <label><input type="radio" name="status" value="failing"/> failing</label>
        <label><input type="radio" name="status" value="passing"/> passing</label>
        <label><input type="radio" name="status" value="known"/> known-fail</label>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="f-hand" checked/> hand</label>
        <label><input type="checkbox" id="f-gen" checked/> gen</label>
      </div>
    </div>
    <ul id="scenario-list"></ul>
  </aside>
  <section id="right">
    <div id="detail-empty">Select a scenario on the left.</div>
    <div id="detail" hidden>
      <div class="d-head">
        <h2 id="d-title"></h2>
        <div>
          <button id="btn-run">Run</button>
          <button id="btn-edit">Edit</button>
        </div>
      </div>
      <div id="d-history" class="history-strip"></div>
      <div id="d-summary"></div>
      <div id="d-svg"></div>
      <div id="d-diagnose" class="diagnose" hidden>
        <h4>Diagnose</h4>
        <div id="d-diag-label"></div>
        <div id="d-diag-hist"></div>
      </div>
      <div id="d-values"></div>
    </div>
    <div id="editor" hidden>
      <div class="d-head">
        <h2 id="e-title">Edit scenario</h2>
        <div>
          <button id="btn-tab-form" class="tab active" data-tab="form">Form</button>
          <button id="btn-tab-json" class="tab" data-tab="json">Raw JSON</button>
          <button id="btn-save">Save</button>
          <button id="btn-cross" title="Cross-generate 30 scenarios over item/weather/terrain">Cross-generate</button>
          <button id="btn-cancel">Cancel</button>
        </div>
      </div>
      <div id="e-form" class="form">
        <label>Name <input id="ef-name" type="text"/></label>
        <fieldset>
          <legend>Attacker</legend>
          <label>Species <input id="ef-a-species" type="text" list="dl-species"/></label>
          <label>Item <input id="ef-a-item" type="text" list="dl-items"/></label>
          <label>Ability <input id="ef-a-ability" type="text"/></label>
          <label>Nature <select id="ef-a-nature"></select></label>
          <label>Tera type <select id="ef-a-tera"></select></label>
          <label><input type="checkbox" id="ef-a-terad"/> terastallized</label>
          <label>Status <select id="ef-a-status"></select></label>
          <div class="evs">
            <label>HP <input type="number" id="ef-a-ev-hp" min="0" max="252" value="0"/></label>
            <label>Atk <input type="number" id="ef-a-ev-atk" min="0" max="252" value="0"/></label>
            <label>Def <input type="number" id="ef-a-ev-def" min="0" max="252" value="0"/></label>
            <label>SpA <input type="number" id="ef-a-ev-spa" min="0" max="252" value="0"/></label>
            <label>SpD <input type="number" id="ef-a-ev-spd" min="0" max="252" value="0"/></label>
            <label>Spe <input type="number" id="ef-a-ev-spe" min="0" max="252" value="0"/></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Defender</legend>
          <label>Species <input id="ef-d-species" type="text" list="dl-species"/></label>
          <label>Item <input id="ef-d-item" type="text" list="dl-items"/></label>
          <label>Ability <input id="ef-d-ability" type="text"/></label>
          <label>Nature <select id="ef-d-nature"></select></label>
          <label>Tera type <select id="ef-d-tera"></select></label>
          <label><input type="checkbox" id="ef-d-terad"/> terastallized</label>
          <label>Status <select id="ef-d-status"></select></label>
          <div class="evs">
            <label>HP <input type="number" id="ef-d-ev-hp" min="0" max="252" value="0"/></label>
            <label>Atk <input type="number" id="ef-d-ev-atk" min="0" max="252" value="0"/></label>
            <label>Def <input type="number" id="ef-d-ev-def" min="0" max="252" value="0"/></label>
            <label>SpA <input type="number" id="ef-d-ev-spa" min="0" max="252" value="0"/></label>
            <label>SpD <input type="number" id="ef-d-ev-spd" min="0" max="252" value="0"/></label>
            <label>Spe <input type="number" id="ef-d-ev-spe" min="0" max="252" value="0"/></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Move / field</legend>
          <label>Move <input id="ef-move" type="text"/></label>
          <label>Category (for cross-gen)
            <select id="ef-cat"><option value="physical">physical</option><option value="special">special</option></select>
          </label>
          <label>Weather <select id="ef-weather"></select></label>
          <label>Terrain <select id="ef-terrain"></select></label>
          <label>Trials <input id="ef-trials" type="number" value="500"/></label>
        </fieldset>
        <datalist id="dl-species"></datalist>
        <datalist id="dl-items"></datalist>
      </div>
      <textarea id="e-text" spellcheck="false" hidden></textarea>
      <div id="e-err"></div>
      <div id="e-cross-log"></div>
    </div>
    <div id="runall" hidden>
      <h3>Run all progress</h3>
      <div id="runall-status">0 / 0</div>
      <ul id="runall-log"></ul>
    </div>
    <div id="regen" hidden>
      <h3>Regen matrix</h3>
      <pre id="regen-log"></pre>
    </div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
