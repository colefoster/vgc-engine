name: pages
# Every push to main that touches product-page/ deploys it to Cloudflare Pages (vgc-engine.colefoster.ca).
on:
  push:
    branches: [main]
    paths: ["product-page/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy product-page --project-name vgc-engine --branch main
