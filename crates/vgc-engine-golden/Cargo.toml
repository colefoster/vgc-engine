[package]
name = "vgc-engine-golden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Synthetic golden-master differential harness — replays a scripted battle against PS-recorded ground truth and reports per-turn divergence. Primary correctness signal for engine mechanics."

[dependencies]
vgc-engine-core = { workspace = true, features = ["chance"] }
vgc-engine-data = { workspace = true }
# Keyed golden mode reuses the conformance key contract (build_table,
# event_for_draw). Conformance depends only on core and data: no cycle.
vgc-engine-conformance = { path = "../vgc-engine-conformance" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Forward the engine's Showdown-compatible RNG (perf_bench PS_RNG=1).
ps-rng = ["vgc-engine-core/ps-rng"]
