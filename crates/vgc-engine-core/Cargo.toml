[package]
name = "vgc-engine-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "vgc-engine simulation core (data-oriented, zero-alloc step loop)"

[dependencies]
vgc-engine-data = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Internal chance-frontier branching. When enabled, exposes
# `Battle::step_chance()` which returns the full outcome frontier of one
# turn as `Vec<(Battle, f64)>` without a record/replay round-trip.
#
# v1 implementation (this milestone): wraps `Rng::Recording` +
# `Rng::OracleKeyed` and produces the same frontier `vgc_solver` does —
# the value is consolidating the API inside engine-core so callers don't
# have to wire two RNG variants themselves. Performance is identical to
# the solver crate's `enumerate_outcomes`.
#
# Future milestones (see `docs/chance-frontier-migration.md`): replace
# the wrapper with native per-site branching in `step()`, with a
# copy-on-write `Battle` so per-outcome cloning is O(1) instead of
# O(state size). The public API stays stable across the migration.
chance = []
# Showdown-compatible RNG mode (docs/accuracy/ps-rng.md). Adds `Rng::Ps` —
# PS's exact PRNG (Sodium/ChaCha20 + Gen5 LCG seeds) with a per-draw trace —
# and compiles in the PS draw-order alignment at gated call sites. Off by
# default: without it those blocks don't exist and behaviour is unchanged.
ps-rng = []
