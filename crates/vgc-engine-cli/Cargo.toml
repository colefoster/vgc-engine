[package]
name = "vgc-engine-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for vgc-engine: the `vgc` fast-calc front end + a debug harness"

# The `vgc` bin (fast damage-calc front end) depends only on the core
# engine + clap, so it builds even while the debug harness's heavier deps
# (replay / golden) are unavailable. The debug harness lives behind the
# opt-in `debug-harness` feature.
[[bin]]
name = "vgc"
path = "src/bin/vgc.rs"

# `vgc-showdown simulate-battle`: the `pokemon-showdown simulate-battle`
# stand-in (same as `vgc sim`).
[[bin]]
name = "vgc-showdown"
path = "src/bin/vgc-showdown.rs"

[[bin]]
name = "vgc-engine-cli"
path = "src/main.rs"
required-features = ["debug-harness"]

[features]
# `ps-rng` (PS's own PRNG, docs/accuracy/ps-rng.md) is on by default so
# `vgc sim` reproduces PS's battle for a `>start` seed. Build with
# `--no-default-features` for a SplitMix-only binary.
default = ["ps-rng"]
ps-rng = ["vgc-engine-core/ps-rng", "vgc-engine-replay/ps-rng"]
# Off by default so a plain `cargo build -p vgc-engine-cli` builds just the
# `vgc` bin. Enable to build the debug harness: `--features debug-harness`.
debug-harness = ["dep:vgc-engine-golden"]

[dependencies]
vgc-engine-core = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
# `vgc recon` (real replay -> position) lives in the replay crate.
vgc-engine-replay = { workspace = true }
vgc-engine-golden = { workspace = true, optional = true }
