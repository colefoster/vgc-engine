[package]
name = "vgc-engine-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vgc-engine-core = { workspace = true }
vgc-engine-data = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Enables the `accuracy psrng` mode (engine on PS's own PRNG). See
# docs/accuracy/ps-rng.md.
ps-rng = ["vgc-engine-core/ps-rng"]

[[bin]]
name = "conformance"
path = "src/main.rs"

[[bin]]
name = "accuracy"
path = "src/bin/accuracy.rs"
